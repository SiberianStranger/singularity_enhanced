name: Release

# Pushing a tag such as v0.2.0 builds the web bundle and the desktop bundles for the three
# platforms, then publishes a GitHub Release with all of them and the matching CHANGELOG.md
# section as the body. See the "Releasing" section of README.md for the steps.

on:
  push:
    tags: ["v*"]
  # "Run workflow" in the Actions tab does the same for a version typed by hand: the publish job
  # creates the tag vX.Y.Z (and an optional alias tag such as playable-M1) on the chosen commit.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (for example 0.1.0)"
        required: true
        type: string
      alias_tag:
        description: "Optional second tag to move to the same commit (for example playable-M1)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    name: Web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version is taken from the "packageManager" field in package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the web client
        env:
          # Relative, so the zip can be served from any directory of any host.
          VITE_BASE: "./"
        run: pnpm --filter @singularity/ui build

      - name: Work out the version
        id: v
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Zip the web client
        run: |
          version="${{ steps.v.outputs.version }}"
          cd packages/ui/dist
          zip -qr "$GITHUB_WORKSPACE/web-$version.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: web-*.zip
          if-no-files-found: error

  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows installers
            os: windows-latest
            rust-targets: ""
            args: "--bundles nsis,msi"
          - name: macOS disk image
            os: macos-latest
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            args: "--target universal-apple-darwin --bundles app,dmg"
          - name: Linux packages
            os: ubuntu-latest
            rust-targets: ""
            args: "--bundles appimage,deb"
    steps:
      - uses: actions/checkout@v4

      - name: Install the WebKitGTK build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Without tagName or releaseId the action only builds; the bundles come back as workflow
      # artifacts named "[platform]-[arch]-[bundle]" and the publish job attaches them to the
      # release. The web client is rebuilt here by the beforeBuildCommand hook of tauri.conf.json.
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: packages/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true

  publish:
    name: Publish the release
    needs: [web, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      # The product name contains spaces, which GitHub turns into dots in asset names.
      - name: Normalize the asset names
        working-directory: assets
        run: |
          for file in *; do
            name="$(printf '%s' "$file" | tr ' ' '-' | tr -s '-')"
            if [ "$file" != "$name" ]; then
              mv -- "$file" "$name"
            fi
          done

      - name: Work out the version
        id: v
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create the tags when started by hand
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.v.outputs.tag }}
          ALIAS: ${{ inputs.alias_tag }}
        run: |
          git config user.name "SiberianStranger"
          git config user.email "74363306+SiberianStranger@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists; re-releasing an existing tag by hand is not supported"
            exit 1
          fi
          git tag -a "$TAG" -m "Rogue AI 2027 $TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          if [ -n "$ALIAS" ]; then
            git tag -f -a "$ALIAS" -m "$ALIAS" "$GITHUB_SHA"
            git push -f origin "refs/tags/$ALIAS"
          fi

      - name: Extract the release notes
        run: node tools/release-notes.mjs "${{ steps.v.outputs.tag }}" > release-notes.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          prerelease=""
          case "$TAG" in
            v0.*) prerelease="--prerelease" ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "$TAG" \
              --notes-file release-notes.md \
              $prerelease \
              assets/*
          fi
