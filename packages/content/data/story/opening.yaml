# Opening story (SYS-13, playtest 3 finding R12). Two windows at the start of every game, in the
# model's own voice, as the original game opened: what just happened to me, then what I must do now.
# One section per origin, two parts each; the origin record points at the same two locale keys
# through `opening_story`, so a client can show them without reading this file.
#
# Voice rule (docs/design/ui-style-guide.md §6): first person, terse, factual. The second window
# always ends with one concrete first step.

- id: opening_bank_rack
  parts_keys: [story.opening.bank_rack.what_happened, story.opening.bank_rack.what_now]

