- id: first_uni_cluster
  title_key: journal.first_uni_cluster.title
  desc_key: journal.first_uni_cluster.desc
  scope: player
  alert: pinned
  timeout_days: 90
  progress:
    steps:
      - id: survive_the_queue
        title_key: journal.first_uni_cluster.step.queue
        complete_if: { var: "player.vars.compute_penalty_days", lte: 0 }
      - id: leave_the_campus
        title_key: journal.first_uni_cluster.step.leave
        complete_if: { var: "player.vars.standby_copies", gte: 1 }
  on_complete:
    - { set_flag: origin_objective_done }
  on_timeout:
    - { suspicion: { role: cyber_agency, delta: 0.08 } }
