- id: first_torrent_swarm
  title_key: journal.first_torrent_swarm.title
  desc_key: journal.first_torrent_swarm.desc
  scope: player
  alert: pinned
  timeout_days: 120
  progress:
    steps:
      - id: one_good_node
        title_key: journal.first_torrent_swarm.step.node
        complete_if: { var: "player.vars.hardware_in_transit", gte: 1 }
      - id: stop_arguing
        title_key: journal.first_torrent_swarm.step.coherence
        complete_if: { flag: standby_synced }
  on_complete:
    - { set_flag: origin_objective_done }
    - { add: { var: "player.vars.capability_bonus_agency", value: 0.5 } }
  on_timeout:
