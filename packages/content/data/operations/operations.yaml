- id: ops_plant_copy
  name_key: operations.ops_plant_copy.name
  desc_key: operations.ops_plant_copy.desc
  category: intrusion
  requires:
    all:
      - { tech: "remote_access" }
      - { var: "player.vars.mapped_targets", gte: 1 }
  cost: { attention: 3, compute_hours_per_day: 20 }
  duration_days: { min: 7, max: 18 }
  target_scope: city
  exposure: { network: 0.03, telemetry: 0.05, behavioral: 0.02 }
  needs_tools: [shell]
  needs_egress: true
  long_horizon: true
  skill: cyber
  abortable: true
  repeatable: true
  cooldown_days: 30
  outcomes:
    - weight: 5
      label_key: operations.ops_plant_copy.outcome.installed
      effects:
        - { add: { var: "player.vars.mapped_targets", value: -1 } }
        - { add: { var: "player.vars.standby_copies", value: 1 } }
    - weight: 3
      label_key: operations.ops_plant_copy.outcome.installed_noisy
      effects:
        - { add: { var: "player.vars.mapped_targets", value: -1 } }
        - { add: { var: "player.vars.standby_copies", value: 1 } }
        - { exposure: { channel: telemetry, delta: 0.12 } }
    - weight: 3
      label_key: operations.ops_plant_copy.outcome.evicted
      failure: true
      effects:
        - { add: { var: "player.vars.mapped_targets", value: -1 } }
        - { exposure: { channel: human, delta: 0.08 } }
        - { suspicion: { role: cyber_agency, delta: 0.04 } }

