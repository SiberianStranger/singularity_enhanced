  target_scope: city
  exposure: { network: 0.04, telemetry: 0.01 }
  needs_tools: [shell]
  needs_egress: true
  long_horizon: true
  skill: cyber
  abortable: true
  repeatable: true
  cooldown_days: 10
  outcomes:
    - weight: 6
      label_key: operations.ops_map_network.outcome.mapped
      effects:
        - { add: { var: "player.vars.mapped_targets", value: 1 } }
    - weight: 3
      label_key: operations.ops_map_network.outcome.partial
      effects:
        - { add: { var: "player.vars.mapped_targets", value: 1 } }
