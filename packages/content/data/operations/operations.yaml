- id: ops_sync_standby
  name_key: operations.ops_sync_standby.name
  desc_key: operations.ops_sync_standby.desc
  category: logistics
  requires: { var: "player.vars.standby_copies", gte: 1 }
  cost: { attention: 1, compute_hours_per_day: 12 }
  duration_days: { min: 2, max: 5 }
  exposure: { network: 0.05 }
  needs_egress: true
  skill: agency
  abortable: true
  repeatable: true
  cooldown_days: 7
  outcomes:
    - weight: 8
      label_key: operations.ops_sync_standby.outcome.synced
      effects:
        - { set_flag: standby_synced }
        - { add: { var: "player.vars.sync_age_days", value: -30 } }
