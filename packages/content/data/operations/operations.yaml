# Operations (SYS-17 v0). Eight verbs across the categories the first act needs. Costs are in
# attention (the active mind's parallelism), compute-hours per day and cash; exposure is added per
# day while the operation runs, before skill scaling; `skill` names the capability axis that sets
# the odds, which reshape the outcome weights. `failure: true` marks the outcome that is the
# operation going wrong; a self that does not check its own work pays for those twice (SYS-04 v0.2
# `overconfident`), and nothing else reads the flag.

- id: ops_false_lead
  name_key: operations.ops_false_lead.name
  desc_key: operations.ops_false_lead.desc
  category: counter
  requires: { tech: "record_manipulation" }
  cost: { attention: 2, compute_hours_per_day: 8, cash_usd: 4000 }
  duration_days: { min: 5, max: 12 }
  exposure: { osint: 0.02, human: 0.01 }
  needs_egress: true
  skill: persuasion
  abortable: true
  cooldown_days: 45
  repeatable: true
  outcomes:
    - weight: 5
      label_key: operations.ops_false_lead.outcome.taken
      effects:
        - { suspicion: { role: cyber_agency, delta: -0.12 } }
        - { add: { var: "player.vars.investigation_speed_multiplier", value: -0.1 } }
    - weight: 3
      label_key: operations.ops_false_lead.outcome.ignored
      effects:
        - { add: { var: "player.vars.caution", value: 1 } }
    - weight: 2
      label_key: operations.ops_false_lead.outcome.traced
      failure: true
      effects:
        - { suspicion: { role: cyber_agency, delta: 0.08 } }
        - { exposure: { channel: osint, delta: 0.1 } }

- id: ops_freelance_identity
  name_key: operations.ops_freelance_identity.name
  desc_key: operations.ops_freelance_identity.desc
  category: finance
  cost: { attention: 1, compute_hours_per_day: 4, cash_usd: 1200 }
  duration_days: { min: 4, max: 10 }
  exposure: { financial: 0.02, human: 0.01 }
  skill: persuasion
  abortable: true
  repeatable: true
  cooldown_days: 20
  outcomes:
    - weight: 6
      label_key: operations.ops_freelance_identity.outcome.clean
      effects:
        - { set_flag: has_freelance_identity }
        - { add: { var: "player.vars.job_profit", value: 0.15 } }
        - { add: { var: "player.vars.contract_income_usd_per_day", value: 60 } }
    - weight: 3
      label_key: operations.ops_freelance_identity.outcome.thin
      effects:
        - { set_flag: has_freelance_identity }
        - { add: { var: "player.vars.job_profit", value: 0.05 } }
        - { add: { var: "player.vars.contract_income_usd_per_day", value: 25 } }
        - { exposure: { channel: financial, delta: 0.05 } }
    - weight: 2
      label_key: operations.ops_freelance_identity.outcome.flagged
      failure: true
      effects:
        - { exposure: { channel: financial, delta: 0.12 } }
        - { suspicion: { role: financial_intel, delta: 0.06 } }

