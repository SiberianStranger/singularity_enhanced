- id: stolen_hgx_node
  name_key: hardware.preset.stolen_hgx_node.name
  desc_key: hardware.preset.stolen_hgx_node.desc
  drawback_key: hardware.preset.stolen_hgx_node.drawback
  # 4 TB of host memory is the top DGX H200 configuration (2 TB is the standard build), and it is
  # what makes the escaped checkpoint hostable at all: at ten trillion parameters a two-bit copy is
  # 2,000 GB before the fresh-architecture factor and 2,600 after it, which is more than the eight
  # cards hold. The rest comes out of RAM at a quarter of the throughput, which is the crisis
  # SYS-03 describes rather than a difficulty setting (lineage table v3, playtest 4 P7).
  nodes:
    - { accelerator: nvidia_h200_sxm, count: 8, ram_gb: 4096, interconnect: nvlink }
  cost_usd: 550000
  power_kw: 10
  class: very_high

