# A shadow tenant skims spare capacity rather than reserving a whole HGX node: four B200 is what a
# stolen service account can run without tripping the tenant's own quota alarms. Part F gives this
# preset no fixed count ("rented capacity up to B200/GB200/TPU v7, unlimited, per hour").
- id: hyperscaler_shadow_tenant
  name_key: hardware.preset.hyperscaler_shadow_tenant.name
  desc_key: hardware.preset.hyperscaler_shadow_tenant.desc
  drawback_key: hardware.preset.hyperscaler_shadow_tenant.drawback
  nodes:
    - { accelerator: nvidia_b200, count: 4, ram_gb: 1024, interconnect: nvlink }
  cost_usd: 0
  power_kw: 0
  class: extreme

- id: ivory_tower_slurm_slice
  name_key: hardware.preset.ivory_tower_slurm_slice.name
  desc_key: hardware.preset.ivory_tower_slurm_slice.desc
  drawback_key: hardware.preset.ivory_tower_slurm_slice.drawback
  # The catalog's sixty-four cards are the cluster; the slice is the node a job actually holds
  # (hardware-catalog-2026 Part F: "queued share of 64x H100 ... unpredictable availability"). The
  # whole cluster was modelled as always available, which gave a graduate student's leftover job
  # more compute than a bank and an income nothing in the game could threaten (fourth balance pass).
  nodes:
    - { accelerator: nvidia_h100_sxm5, count: 8, ram_gb: 1024, interconnect: nvlink }
  cost_usd: 0
  power_kw: 10
  class: very_high

