# Hardware presets (SYS-04, SYS-02). The fifteen configurator presets of
# docs/research/hardware-catalog-2026.md Part F, one record each, in the order of that table.
# Memory is not stored: it is the sum of the nodes' accelerator memory, which the compute system
# derives from accelerators.yaml. cost_usd is the midpoint of the Part F range, rounded to the
# nearest 50 USD; power_kw is the Part F figure (midpoint where it gives a range); class is the
# Part F throughput bucket. cost_usd is 0 for the presets that are access rather than ownership
# (a queue share, a state allocation, a rented tenancy).

- id: ascend_rack
  name_key: hardware.preset.ascend_rack.name
  desc_key: hardware.preset.ascend_rack.desc
  drawback_key: hardware.preset.ascend_rack.drawback
  nodes:
    - { accelerator: huawei_ascend_910c, count: 8, ram_gb: 1024, interconnect: fabric }
    - { accelerator: huawei_ascend_910c, count: 8, ram_gb: 1024, interconnect: fabric }
  cost_usd: 0
  power_kw: 8.8
  class: high

