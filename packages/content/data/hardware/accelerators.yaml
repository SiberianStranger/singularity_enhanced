# Accelerators (SYS-02). One record per entry in docs/research/hardware-catalog-2026.json; the
# research id is kept in source_id and the record id is the same string with underscores.
#
# Field mapping: memory_gb, memory_bandwidth_gbs, tdp_w, form_factor, interconnect, launch_year and
# arch are copied. tflops_fp16 is tflops.fp16_dense, or tflops.fp8_dense / 2 where a vendor only
# publishes FP8 (the dense FP8:FP16 ratio on Hopper and Blackwell), or null. price_usd_new and
# price_usd_used come from price_usd_2026. cloud_usd_per_hour comes from cloud_usd_per_hour_2026.
#
# export_control_to_china collapses the research prose to the four values the game needs:
# text starting with "unrestricted", "restricted" or "banned" keeps that word; a grey-market
# circumvention product counts as banned, because the silicon under the mod is; a domestic Chinese
# part or a China-compliant SKU is china_variant; "n/a (cloud-only)" and "internal-only" leave the
# field out. availability maps the research labels onto cloud / enterprise / retail / used / gray /
# china_only; "internal-only" parts are reachable only as cloud instances, so they map to cloud.
#
# Where a vendor discloses no figure the record carries the nearest documented analogue and a
# comment says which. Records whose comment says "placeholder" have no usable public specification
# and are not referenced by any hardware preset.
