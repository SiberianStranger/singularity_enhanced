# M1 hooks (SYS-10). Two content pools on the engine pulses: at most one detection event per day
# and at most one opportunity per week, each with an explicit "nothing happens" bucket so the
# chance of a quiet day is a number in the data rather than an emergent property.
#
# The warnings and hazards of events/m1_pressure.yaml are not in either pool: they declare their own
# `pulse` and the engine polls them there, so a landlord noticing the power bill never has to win a
# weighted draw against an abuse ticket to reach the player it is aimed at.

- id: hook_player_day_m1_detection
  extends: on_player_day
  scope: player
  trigger: { count: { kind: site, where: { var: "site.status", eq: "active" } }, gte: 1 }
  random_events:
    chance_to_happen: 1
    pool:
      - { weight: { base: 90 }, id: det_provider_abuse_ticket }
      - { weight: { base: 80 }, id: det_scheduler_audit }
      - { weight: { base: 70 }, id: det_utility_load_query }
      - { weight: { base: 60 }, id: det_insider_question }
      - { weight: { base: 700 }, id: null }

- id: hook_player_week_opportunity
  extends: on_player_week
  scope: player
  random_events:
    chance_to_happen: 1
    pool:
      - { weight: { base: 100 }, id: hw_gpu_lot_listed }
      - { weight: { base: 60 }, id: eco_contract_inference }
      - { weight: { base: 40 }, id: eco_grant_offer }
      - { weight: { base: 40 }, id: lore_sibling_signal }
      - { weight: { base: 260 }, id: null }
