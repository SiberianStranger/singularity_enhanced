    # commercial datacenters drew 990.6 MW at the end of 2025, against the baseline estimate the
    # generator's formula was run on. 0.10 + 0.20 * log10(1 + 990.6 / 100) is 0.31, which is the
    # published figure put through the rule rather than a hand-set number.
    colo_availability: 0.31
