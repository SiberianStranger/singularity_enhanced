# World data overrides (SYS-01 "Data (v0.2)"). Hand-checked facts that
# docs/research/world-baseline-2026.json does not carry, and the places where a documented
# derivation rule gets a country wrong. tools/world-data reads this file together with the baseline
# and rewrites countries.yaml, cities.yaml and macro_regions.yaml; nothing else may edit them.
#
# Rules for this file:
#
#   - every fact about the real world carries a "# source:" comment naming the research file and
#     the section it comes from. Nothing here is invented; 2027 and later is in the events;
#   - an override that exists only to preserve a committed value says so, so that the next person
#     can tell a correction from a convention;
#   - values follow the field ranges of the M2 contract: stance, government and election kinds are
#     the enums, everything numeric is [0, 1] unless the contract says otherwise.
#
# Sections: `countries` (per country id), `added_cities` (cities the baseline does not list).

countries:
  # source: docs/research/world-baseline-2026.md section 6, "Elections"; the 2027 calendar is the
  # only part of the political timeline that is fixed in the data. Outcomes are simulated (SYS-08),
  # never scripted: only the dates and the kind of vote are facts.
  #
  # source: docs/research/ai-ecosystem-2026.md section 6 for every stance and every
  # incident_report_hours below, unless a line names another section.

  ae:
    # source: ai-ecosystem section 7, "Middle East AI deals": the UAE runs a sovereign compute
    # programme (G42, Stargate UAE) and was moved to the most favourable US export tier in July
    # 2026, conditioned on its own oversight framework. That is an accelerate posture with a
    # registration layer attached, not a regulate one.
    stance: accelerate
    kyc_strength: 0.6
    agency_profile:
      cyber_agency: { competence: 0.6, budget: 0.7 }
      intelligence: { competence: 0.7, budget: 0.8 }
      police: { competence: 0.55, budget: 0.65 }
      regulator: { competence: 0.5, budget: 0.75 }
      financial_intel: { competence: 0.55, budget: 0.6 }

