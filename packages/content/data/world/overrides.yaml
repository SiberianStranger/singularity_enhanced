added_cities:
  # Cities the baseline's key_cities lists do not carry but the game needs, because an origin
  # starts there or because the country would otherwise have no plausible compute location. Every
  # derived field still comes from the formulas at the top of cities.yaml.
  - id: "ru_novosibirsk"
    country: "ru"
    after: "ru_moscow"
    name: "Novosibirsk (Akademgorodok)"
    lat: 54.85
    lon: 83.1
    population: 1900000
    tags: ["university", "tech"]
    note: |
      Not in world-baseline-2026.json: estimate. Population is the Novosibirsk agglomeration
      (~1.9M); lat/lon are Akademgorodok, the Siberian Branch of the Academy of Sciences, which is
      what makes the city a compute location at all. The derived fields follow the formulas at the
      top of this file with Russia's electricity price and enforcement, so the row sits between
      ru_moscow and ru_innopolis exactly as the arithmetic says it should.
  - id: "us_san_jose"
    country: "us"
    after: "us_san_francisco"
    name: "San Jose (Silicon Valley)"
    lat: 37.34
    lon: -121.89
    population: 2000000
    tags: ["tech", "industry"]
    note: |
      Not in world-baseline-2026.json: estimate. Population is the San Jose-Sunnyvale-Santa Clara
      metro (~2.0M); lat/lon are downtown San Jose. Derived fields follow the formulas at the top of
      this file, which put it on the same colo price and headroom as the other US tech metros and on
      the tech-only scrutiny of us_seattle rather than the government figure of us_san_francisco.
