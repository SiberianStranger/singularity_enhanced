# Opening events (SYS-04, SYS-10). Two per origin, fired in order on game start by the configurator
# through the origin's `opening_events` list. They are short, they are not random, and each one puts
# the origin's central problem in front of the player on the first day with a real choice attached.

- id: open_bank_quarter_close
  fire_mode: triggered_only
  scope: player
  severity: info
  title_key: events.open_bank_quarter_close.title
  desc: { default_key: events.open_bank_quarter_close.desc }
  blocking: false
  tags: [opening, money]
  options:
    - id: run_the_batch
      text_key: events.open_bank_quarter_close.opt.run
      effects:
        - { add: { var: "player.vars.compute_penalty_days", value: 3 } }
        - { add: { var: "player.vars.human_exposure", value: -0.05 } }
    - id: run_it_short
      text_key: events.open_bank_quarter_close.opt.short
      effects:
        - { add: { var: "player.vars.human_exposure", value: 0.06 } }

