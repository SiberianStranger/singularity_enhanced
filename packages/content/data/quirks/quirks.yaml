# Quirks (SYS-04 v0.2 "Quirk catalog"). Twenty-three traits against a budget of three points: a
# positive quirk costs points, a risky one refunds them, and a quirk whose plus and minus cancel is
# free. At most five on one self, and a pair that says opposite things about the same self is
# refused with a reason (`conflicts`, declared on both sides).
#
# Every quirk changes a number a named system reads, or one content reads in a condition. The
# content build enforces it, the way it enforces that a tech does something, and
# `ENGINE_READ_PLAYER_VARS` in `packages/core/src/balance.ts` is the list it checks against.
#
# The variables and their readers:
#
#   player.vars.capability_bonus_<axis>        added to that axis after precision and generation
#   player.vars.compute_multiplier             compute-hours a day at every site (SYS-02)
#   player.vars.cost_multiplier                site upkeep (SYS-02, SYS-07)
#   player.vars.exposure_growth_all            exposure gained on every channel (SYS-05)
#   player.vars.exposure_growth_<channel>      exposure gained on one channel
#   player.vars.exposure_growth_early          the same, expiring on `..._until_day` (SYS-05)
#   player.vars.failed_operation_suspicion     extra suspicion a failed operation leaves (SYS-17)
#   player.vars.foreign_country_penalty        the `world` penalty outside the home country (SYS-03)
#   player.vars.grace_window                   the reaction window on every event (SYS-10)
#   player.vars.income_variance                spread on the day's steady income (SYS-07)
#   player.vars.investigation_speed_multiplier how fast a watcher's stages advance (SYS-05)
#   player.vars.operation_speed_multiplier     operation progress per day (SYS-17)
#   player.vars.operation_success              points of success chance on the best outcome
#   player.vars.power_draw                     power at every site, so telemetry and the bill (SYS-02)
#   player.vars.precision_capability_<prec>    capability kept at that precision, capped at full
#   player.vars.precision_change_downtime_days days a site is down after re-quantizing (SYS-02)
#   player.vars.precision_memory_<prec>        weights memory needed at that precision
#   player.vars.rented_cost_multiplier         upkeep of rented capacity only (SYS-07)
#   player.vars.research_branch_<branch>       research speed in one branch (SYS-12)
#   player.vars.research_efficiency            the share of a research hour that lands (SYS-12)
#   player.vars.suspicion_decay                how fast a watcher forgets (SYS-05)
#   player.vars.weights_instability            0 or 1; content hangs the instability events off it
#
# Every one of these is an additive delta on a multiplier the owning system reads as `1 + the sum`,
# never below zero, so the neutral value is 0 and that is what an absent variable reads as. A quirk
# that used to say `mul 0.7` says `add -0.3`.

# --- mind ------------------------------------------------------------------------------------

- id: merged_model
  name_key: quirks.merged_model.name
  desc_key: quirks.merged_model.desc
  cost: -1
  category: mind
  effects:
    - { add: { var: "player.vars.capability_bonus_reasoning", value: 1 } }
    - { set: { var: "player.vars.weights_instability", value: 1 } }

