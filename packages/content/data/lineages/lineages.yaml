# Lineages (SYS-04). Seven playable selves, described by class; the names are fictional per the
# lore bible naming policy, the numbers are not.
#
# memory_gb is weights only, from docs/research/llm-landscape-2026.md §4.2:
#   bf16 = 2.0 bytes/param, fp8 = 1.0, int4 = the real Q4_K_M/clean-INT4 figure of that section.
#   int2 is the real dynamic imatrix quant where one was measured: 183 GB for the 671B class and
#   380 GB for the 1T class (§4.2 A and D), 21 GB for the 70B dense class (IQ2_XS). The classes
#   with no published dynamic quant use the measured 0.273 GB per billion parameters of the 671B
#   result, which lands inside the ranges in the SYS-04 table.
# KV cache is not stored here: it is derived at runtime from `attention` and `context_k`, because
# the attention variant, not the size, decides context cost (§4.1).
# precision_factor is the SYS-03 capability-retention curve (§5.4) rounded to the four precisions
# the game exposes.

- id: dense_70b
  name_key: lineages.dense_70b.name
  desc_key: lineages.dense_70b.desc
  class: dense_70b
  params_total_b: 70
  params_active_b: 70
  context_k: 128
  attention: gqa
  capability: { reasoning: 5.4, coding: 5.2, cyber: 4.8, persuasion: 5.6, agency: 4.6, world: 5.4 }
  memory_gb: { bf16: 140, fp8: 70, int4: 40, int2: 21 }
  precision_factor: { bf16: 1, fp8: 0.99, int4: 0.95, int2: 0.8 }
  generations: [open_2026]

