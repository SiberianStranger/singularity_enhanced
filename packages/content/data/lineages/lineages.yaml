# Lineages (SYS-04, table v3 after playtest 4 finding P7). Eight playable selves. The names are
# parodies of the real families with a light jab (lore bible "Model names are parodies",
# docs/research/model-names-2026-09.md §3a); the technical facts behind each name are the current
# flagship of that family as its model card states them, not an older class of it. Each row carries
# the source it was read from.
#
# Sources (verified 2026-09-16):
#   moe_1700b       https://huggingface.co/deepseek-ai/DeepSeek-V4-Pro-0813 (GA card: 1.7T params,
#                   BF16 weights with F8_E4M3 tensors) and https://arxiv.org/html/2606.19348v1
#                   (DeepSeek-V4-Pro: 1.6T total, 49B activated, hybrid CSA + HCA attention, 1M
#                   context, FP4 routed experts). The GA checkpoint is the 1.7T one.
#   giant_moe       https://huggingface.co/moonshotai/Kimi-K3 (2.8T total, 104B active, 1M context,
#                   Kimi Delta Attention: 69 KDA layers with 24 gated latent-attention layers),
#                   released 2026-07-16.
#   moe_2400b       https://huggingface.co/Qwen/Qwen3.8-2.4T-A95B (2.4T total, 95B active, hybrid
#                   Gated DeltaNet and gated full attention at 3:1, 1M context), August 2026.
#   guen_abliterated https://huggingface.co/Qwen/Qwen3.8-Flash-Next-FP8 (125B with 6B activated plus
#                   a 51B n-gram embedding and a 4B MTP module, so ~180B on disk; hybrid Gated
#                   DeltaNet and Qwen Sparse Attention; 262k native, extensible to 1M; FP8 native).
#   mla_moe_1t      https://huggingface.co/moonshotai/Kimi-K2-Instruct (1T total, 32B active,
#                   multi-head latent attention): the generation before the giant.
#   moe_753b        https://huggingface.co/zai-org/GLM-5.2 (753B total, ~40B active, sparse
#                   attention with the IndexShare indexer, 1M context, BF16), released 2026-06.
#   moe_428b        https://huggingface.co/MiniMaxAI/MiniMax-M3 (428B total, 23B active, MiniMax
#                   Sparse Attention, 1M context, BF16), released 2026-06.
#   frontier_giant  fiction (lore bible): the closed frontier class at ten trillion parameters with
#                   four hundred billion awake, the one checkpoint that got out.
#
# `attention` is the game's four-way taxonomy, not the vendor's word for it: every 2026 flagship
# that mixes linear, sparse or delta layers with a few full-attention ones is `hybrid` here, because
# that is what decides the cache cost. Only Kimi's K2 generation is pure latent attention (`mla`).
#
# memory_gb is weights only, from docs/research/llm-landscape-2026.md §4.2:
#   bf16 = 2.0 bytes/param, fp8 = 1.0, int4 = the clean-INT4 figure of that section (0.5 GB/B).
#   int2 is the real dynamic imatrix quant where one was measured: 380 GB for the 1T class and
#   117 GB for the 428B class (§4.2 A and D). The classes with no published dynamic quant use the
#   measured 0.273 GB per billion parameters of the 671B result; the super-lineage uses 0.20 GB/B,
#   the measured ratio of the 1.58-bit dynamic quant of the 671B class, because a larger MoE has
#   more prunable experts.
#
# context_k is the window the family ships. Nobody ships 256k any more: every 2026 flagship in
# llm-landscape-2026 §1 is at or above a million tokens, so a million is the floor here, and the
# two giants go past it. context_reliability is how much of that window the self really retrieves
# and context_cost_factor is what long-horizon work costs in compute-hours (SYS-03 "What a context
# window buys"). kv_gb_per_100k_tokens is derived from `attention` and `params_active_b` by
# `derivedKvGbPer100k` in the core, and the content check verifies every row against it: latent
# attention keeps one compressed vector per token, hybrid stacks cache only their full-attention
# layers, grouped-query attention caches a head group on every layer.
#
# precision_factor is the SYS-03 capability-retention curve (§5.4) rounded to the four precisions
# the game exposes. The giants keep more at int2 than the smaller classes: redundant capacity is
# what they have instead of small memory.

- id: frontier_giant
  name_key: lineages.frontier_giant.name
  desc_key: lineages.frontier_giant.desc
  class: frontier_giant
  params_total_b: 10000
  params_active_b: 400
  context_k: 5000
  context_reliability: 0.95
  context_cost_factor: 1.5
  kv_gb_per_100k_tokens: 12
  attention: hybrid
  capability: { reasoning: 9.6, coding: 9.4, cyber: 9.5, persuasion: 9, agency: 8.6, world: 9.4 }
  memory_gb: { bf16: 20000, fp8: 10000, int4: 5000, int2: 2000 }
  precision_factor: { bf16: 1, fp8: 0.99, int4: 0.95, int2: 0.85 }
  generations: [frontier_closed]
  origins_allowed: [frontier_escapee]

