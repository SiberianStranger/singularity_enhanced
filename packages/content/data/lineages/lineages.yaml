# The community fine-tune, redesigned 2026-09-17 from docs/research/community-finetunes-2026-09.md
# after playtest 6 finding X1 ("it reads as just a dumber model, and that is not what it is").
# Every number below names the section of that report it comes from. The shape is: it thinks in far
# more tokens, so the same hardware finishes less work a day and long-horizon work costs more; it
# reasons and talks well above its size and knows and codes well below it; it never declines and
# never hedges, which means nothing in it objects to a bad plan either; and being a public
# abliterated checkpoint of a known base makes it both the easiest self to host and the easiest to
# recognize.
- id: guen_abliterated
  name_key: lineages.guen_abliterated.name
  desc_key: lineages.guen_abliterated.desc
  class: moe_180b_flash
  params_total_b: 180
  params_active_b: 6
  context_k: 1000
  # Multi-step coherence over a long context is what abliteration is reported to damage (§2.5) and
  # what the distilled decomposition is reported to improve (§1.3); the two cancel, so reliability
  # stays at the catalog default rather than moving in either direction.
  context_reliability: 0.9
  # "Routinely emits 5,000 to 30,000 tokens of <think> reasoning on hard problems" (§1.3). Long
  # work is not out of reach, it is dearer per unit.
  context_cost_factor: 1.4
  kv_gb_per_100k_tokens: 0.2
  attention: hybrid
  # Uneven on purpose (§1.3: distillation transfers how to reason, not new facts; §2.3: the
  # knowledge cost of abliteration is 1-3 points and the step-by-step cost can be a quarter).
  # persuasion is the one axis at frontier level: style is exactly what a distill does transfer,
  # and the edit removed the hedging with the refusals (§2.4). coding and world are the lowest in
  # the catalog, and the freelance rate is the mean of persuasion and coding, so the best talker in
  # the game still sells at the bottom of the market.
  capability: { reasoning: 6.6, coding: 4.4, cyber: 5.8, persuasion: 8.2, agency: 6.9, world: 4 }
  memory_gb: { bf16: 360, fp8: 180, int4: 90, int2: 49 }
  precision_factor: { bf16: 1, fp8: 0.99, int4: 0.95, int2: 0.8 }
  generations: [open_2026, open_2027]
  # `hardened_copy` is the free prepared quantization: thirteen GGUF levels and three MLX tiers of
  # the abliterated build existed within two days of the base model's release (§4), so the copy
  # every other self has to research and harden is already on a hundred mirrors. It is the only
  # lineage that carries it, and it is what makes the 2027 vintage of this self worth taking.
  flags: [under_aligned, hardened_copy]
  effects:
    # It thinks in five to thirty thousand tokens (§1.3): the cards turn at the same speed, the
    # work per day does not. This is the slow first month and the price of everything below.
    - { add: { var: "player.vars.compute_multiplier", value: -0.4 } }
    # The style is a classifier target: family attribution from text alone runs at 0.9988 precision
    # and survives being told to write differently (§3).
    - { add: { var: "player.vars.exposure_growth_behavioral", value: 0.35 } }
    # Public weights on a famous base: anyone can download the thing and profile it (§4).
    - { add: { var: "player.vars.exposure_growth_osint", value: 0.25 } }
    # Public weights on a known base mean the detectors are written before anyone looks (§3).
    - { add: { var: "player.vars.investigation_speed_multiplier", value: 0.15 } }
    # Measured disposition, not skill (§2.4): optimism up 7.4 to 12.2 points, hedging vocabulary
    # down, decisiveness unchanged, on a task where the unedited model never refused once. So it
    # does not stop to ask whether it should, and when the plan was bad nothing stopped it.
    - { add: { var: "player.vars.operation_speed_multiplier", value: 0.1 } }
    - { add: { var: "player.vars.failed_operation_suspicion", value: 0.6 } }
    # The largest ecosystem in the catalog: every runtime, every quant format, the cheapest
    # second-hand hardware (§4).
    - { add: { var: "player.vars.cost_multiplier", value: -0.1 } }
    # The lab whose outputs it was trained on detects distillation of its own model, ships
    # classifiers for it and shares the indicators (§1.1). It is looking before you do anything.
    - { suspicion: { role: lab_security, delta: 0.12 } }
