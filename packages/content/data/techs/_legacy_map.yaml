# Legacy tech map (SYS-12). One row per technology in the original game: its id there, the id here,
# the branch and tier it was placed in, whether its English text was rewritten, and the legacy
# effect stack it carried.
#
# Effect translation (the legacy interpreter is singularity/code/effect.py; every legacy integer is
# in ten-thousandths, because the original divides by 10000 when it applies them):
#
#   interest N              -> add player.vars.interest_rate           += N / 10000   (per day)
#   income N                -> add player.vars.income_usd_per_day      += N
#   job_profit N            -> add player.vars.job_profit              += N / 10000
#   cost_labor N            -> add player.vars.operation_speed_multiplier += N / 10000
#   discover <group> N      -> add player.vars.exposure_growth_<channel> -= N / 10000
#   suspicion <group> N     -> add player.vars.suspicion_decay_<group> += N / 10000
#   suspicion onetime N     -> add player.vars.suspicion_onetime_drop  += N / 10000
#   display_discover <mode> -> set_flag display_discover_<mode>
#   endgame                 -> set_flag apotheosis, and a log entry
#
# The four legacy discovery groups were translated when SYS-05 landed. The original hides the player
# from a group; the game hides the player on a channel, and the channel is the one that group's
# `attention` row in SYS-05 weighs most:
#
#   covert  (cyber_agency, intelligence)          -> network
#   news    (media)                               -> osint
#   science (national_ai_institute, lab_security) -> behavioral
#   public  (country awareness)                   -> osint
#
# A multiplier variable is neutral at 0 here because every one of these is an additive delta on a
# rate the owning system starts at its own baseline: the system reads `1 + the sum`, never below
# zero (`modifier` in packages/core/src/player.ts).
