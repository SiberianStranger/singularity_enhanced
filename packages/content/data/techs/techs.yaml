# Techs (SYS-12). The original game's 57 technologies, re-tiered into the eight branches of SYS-12,
# plus 15 written for the branches the original has no equivalent of (harness, self, compute).
# _legacy_map.yaml holds the old id -> new id table and the effect translation; the rules are:
#
#   compute_hours = a band per tier, with each tech placed inside its band by its rank in the
#                   original's CPU cost, so the original's ordering survives while the numbers fit
#                   the compute a 2027 self actually has. The bands are
#                     t0 60-600, t1 400-2,400, t2 1,800-9,000, t3 8,000-40,000,
#                     t4 40,000-200,000, t5 250,000-1,200,000, t6 3,000,000-6,000,000.
#                   The original's own conversion (CPU-days * 24) assumed the exponential CPU growth
#                   of a 2005 game; here throughput is bounded by memory bandwidth, so a flat
#                   conversion made the first tier cost a hobbyist most of a year. See the
#                   "Balance notes" section of docs/design/07-economy.md.
#   min_days      = a floor per tier (t0 2, t1 5, t2 10, t3 18, t4 30, t5 45, t6 60), raised where
#                   the tech already carried a longer one. It is what stops an origin with a rack of
#                   B200s from finishing a branch in an afternoon (SYS-12 "min_days prevents
#                   brute-forcing with huge compute").
#   cash_usd      = legacy cash cost, unchanged. The original's currency is USD and its scale still
#                   reads correctly for 2027: three figures for a first tech, eight for an endgame
#                   project.
#   danger        carried over unchanged (0-4, the exposure multiplier while researching).
#   requires      the legacy prerequisite list, which is always conjunctive, as { all: [ { tech } ] }.
#
# Texts are rewritten wherever the original is dated (processors, satellites, "the Internet") and
# keep the original meaning. The new techs are grounded in docs/research/llm-landscape-2026.md §5
# and §6 (prepared quantization, LoRA and RL post-training costs) and §4.4 (CPU offload).
