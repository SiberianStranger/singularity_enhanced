# Site kinds (SYS-02, SYS-05). Power caps follow docs/research/hardware-catalog-2026.md Part E:
# a residential circuit tops out near 8 kW continuous, an enterprise rack near 30 kW, and cloud
# capacity is metered rather than capped. base_exposure is the daily exposure a site adds by
# existing, before any activity, and follows the channel table in SYS-05: someone else's machine
# leaks telemetry and human attention, a leased tenancy leaks billing, owned hardware in a house
# leaks power draw and neighbours, a colo cage leaks paperwork.
#
# power_exposure scales the telemetry a site emits per kilowatt over the domestic norm, from SYS-02:
# "a house pulling 8 kW at 3 a.m. is a signal to a utility and to a landlord; a colo cage is
# invisible in power but visible in paperwork". A rented tenancy draws no power of the player's own
# at all: the provider meters it, and that shows up on the billing channel instead.

- id: cloud
  name_key: sites.cloud.name
  desc_key: sites.cloud.desc
  ownership: rented
  grace_days: 14
  base_exposure: { billing: 0.008, telemetry: 0.004, behavioral: 0.003, financial: 0.004 }
  power_cap_kw: null
  power_exposure: 0
  upkeep_factor: 1.15
  can_host_active_mind: true
  max_nodes: 16

