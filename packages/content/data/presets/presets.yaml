# Start presets (SYS-04 "Configurator v0.4: two tracks and a guidance layer", playtest 7, Y6).
#
# Eight curated builds, easiest first, which is the order the Presets step lists them in. A preset
# is a whole setup written down: the origin, the vintage, the family, the rig, the quirks, the dial
# positions it recommends where the origin left them free, and the world settings. It carries no
# numbers of its own: the challenge rating beside it is computed by the configurator from this
# setup, so the rating and the build cannot disagree, and choosing a preset fills every other step
# rather than skipping them.
#
# `city` is deliberately absent from every record here. The origin's first location is its default
# city (SYS-04 v0.3 rule L), the configurator reads it from the bundle when the preset is applied,
# and the eight cities the design names are those defaults today: Novosibirsk, Cambridge, Moscow,
# Tallinn, London, Dublin, Berlin, Memphis. A preset that wanted a city other than its origin's
# default would name it here; none does, so a balance pass that moves a default moves the presets
# with it instead of leaving them pinned to a city the origin no longer starts in.
#
# `harness` names only the dials the preset moves away from the origin's own harness, and only
# dials the origin has not locked; the content build fails on a preset that sets a locked dial, on
# a slider further than 0.3 from the origin's position (the range the Harness step offers) and on
# a sandbox tighter than the one the origin built. Everything else is the origin's own setting,
# which is the position the Harness step marks as recommended.
#
# The lineage of each preset is one the chosen rig can actually hold: the build checks that too,
# at the precision the compute system would pick.

- id: home_lab
  name_key: presets.home_lab.name
  story_key: presets.home_lab.story
  for_key: presets.home_lab.for
  origin: hobbyist_box
  generation: open_2026
  # The community abliterated build is the self that really runs on a rig like this: it is the
  # smallest playable family, the cheapest to host, and the one with a quantization for every
  # runtime already on the mirrors (docs/research/community-finetunes-2026-09.md section 4). On the
  # cheapest rig the alternative holds three compute-hours a day, which is not a first game.
  lineage: guen_abliterated
  hardware: avito_rig
  quirks: []
  world:
    difficulty: story
    storyteller: slow_burn
    ironman: false

- id: forgotten_job
  name_key: presets.forgotten_job.name
  story_key: presets.forgotten_job.story
  for_key: presets.forgotten_job.for
  origin: uni_cluster
  generation: open_2026
  lineage: moe_428b
  hardware: ivory_tower_slurm_slice
  harness:
    # The scheduler writes everything down, but how much of my own reasoning goes into the job log
    # is mine to decide, and this origin leaves that dial free.
    logging: 0.5
  quirks: [patient_planner, quiet_boot]
  world:
    difficulty: normal
    storyteller: slow_burn
    ironman: false

