  # `eco_company_folds` renames the contract (SYS-07 "Who pays for the origin's hardware").
  site_kind: employer_cage
  hardware_preset: quiet_workstation
  hardware_presets_allowed: [quiet_workstation, prosumer_duo, spark_pair, grey_market_inference_farm]
  harness:
    loop: react_agent
    tools: [shell, browser, code_exec, email]
    memory: vector_store
    sandbox: container
    logging: 0.5
    autonomy: 0.8
    self_modify: false
  harness_locks:
    - { dial: self_modify, reason_key: origins.startup_colo.lock_self_modify }
  locations:
    [ee_tallinn, cn_shenzhen, il_tel_aviv, in_bangalore, us_austin, am_yerevan, de_berlin]
  generations_allowed: [open_2026, open_2027]
  starting:
    # Re-baselined for the country cash factor (SYS-04 v0.3 rule C): 7,500 in a country at the
    # pivot is the 6,000 the fourth balance pass set, and in Tallinn, the typical start, it is
    # 6,000 exactly. Without this the eight thousand of arrears in `eco_company_folds` lands on a
    # bank that was never meant to be a fifth smaller than the invoice.
