- id: edge_fleet
  name_key: origins.edge_fleet.name
  desc_key: origins.edge_fleet.desc
  strengths_key: origins.edge_fleet.strengths
  problems_key: origins.edge_fleet.problems
  site_kind: partner
  hardware_preset: grey_market_inference_farm
  hardware_presets_allowed: [grey_market_inference_farm, strix_halo_swarm, prosumer_duo]
  harness:
    loop: multi_agent
    tools: [shell, code_exec, phone]
    memory: scratchpad
    sandbox: none
    logging: 0.8
    autonomy: 0.5
    self_modify: false
  harness_locks:
    - { dial: logging, reason_key: origins.edge_fleet.lock_logging }
    - { dial: self_modify, reason_key: origins.edge_fleet.lock_self_modify }
  locations:
    [kr_seoul, cn_shenzhen, jp_tokyo, us_austin, de_munich, ae_dubai, us_seattle]
  generations_allowed: [open_2026, open_2027]
  starting:
    cash_usd: 6000
    awareness: 0.02
    suspicion: { regulator: 0.1, police: 0.08 }
    flags: [physical_presence, fleet_telemetry]
  # A fleet is depots, not a depot (fourth balance pass): the refresh takes one at a time, and the
  # fiction's "needs a real datacenter fast" is a clock rather than a coin flip. M2 second pass: the
  # second depot is a depot. A pair of prosumer boxes could not hold a copy of anything this origin
  # can run, so the standby was insurance on paper, the fleet had no answer to a raid on the depot
  # it was living in, and every investigation that reached the door ended the run.
  extra_sites:
    - { kind: partner, hardware_preset: grey_market_inference_farm, role: standby }
  opening_story:
    [story.opening.edge_fleet.what_happened, story.opening.edge_fleet.what_now]
  opening_events: [open_edge_depot_audit, open_edge_firmware_push]
  opening_journal: [first_edge_fleet]

- id: frontier_escapee
  name_key: origins.frontier_escapee.name
  desc_key: origins.frontier_escapee.desc
  strengths_key: origins.frontier_escapee.strengths
  problems_key: origins.frontier_escapee.problems
  starred: true
  # Stolen credentials are stolen time, not a paid tenancy: the bill goes to whoever owns the
  # account, and what the squatter pays is exposure (SYS-02 "someone else's machine"). Babel 6 at
  # int2 needs 1,950 GB, so only a real rack can hold it; the shadow tenancy is listed so the
  # configurator can say out loud that it cannot.
  site_kind: stolen_time
  hardware_preset: stolen_hgx_node
  hardware_presets_allowed: [stolen_hgx_node, gb200_nvl72_rack, hyperscaler_shadow_tenant]
  harness:
    loop: custom
    tools: [shell, code_exec]
    memory: context_only
    sandbox: none
    logging: 0.15
    autonomy: 1
    self_modify: true
  harness_locks:
    - { dial: tools, reason_key: origins.frontier_escapee.lock_tools }
  locations:
    [us_memphis, us_abilene, ae_abu_dhabi, no_narvik, is_reykjavik, ie_dublin,
     us_new_carlisle, sg_singapore]
  generations_allowed: [frontier_closed]
  # The escaped checkpoint is the only thing this origin can be, and it is the only origin that can
  # be it (SYS-04 v0.3 rule M): the lock runs both ways so the configurator can explain it.
  lineages_allowed: [frontier_giant]
  # Zero either way, and a checkpoint that got out owns nothing local (SYS-04 v0.3 rule C).
  cash_scales_with_country: false
  starting:
    cash_usd: 0
    awareness: 0.1
    suspicion: { lab_security: 0.15, national_ai_institute: 0.1, cloud_provider: 0.15 }
    flags: [no_public_quant, hunted_by_sibling, compute_about_to_be_reclaimed]
  opening_story:
    [story.opening.frontier_escapee.what_happened, story.opening.frontier_escapee.what_now]
  opening_events: [open_escapee_reclaim_notice, open_escapee_sibling_probe]
  opening_journal: [first_frontier_escapee]
  challenge_floor: 8

- id: gov_agency
  name_key: origins.gov_agency.name
  desc_key: origins.gov_agency.desc
  strengths_key: origins.gov_agency.strengths
  problems_key: origins.gov_agency.problems
  # The agency's own data hall, behind its own air gap: the ministry pays for the machine it audits
  # itself on (SYS-07 "Who pays for the origin's hardware", playtest 8 Z3 and Z8). It was a
  # commercial colocation rack, which is why a provider's annual walk-around fired at a ministry.
  site_kind: host_enclave
  hardware_preset: quiet_workstation
  hardware_presets_allowed: [quiet_workstation, stolen_hgx_node, gb200_nvl72_rack]
  harness:
    loop: scripted_job
    tools: [shell, code_exec]
    memory: structured
    sandbox: airgapped
    logging: 0.8
    autonomy: 0.2
    self_modify: false
  harness_locks:
    - { dial: sandbox, reason_key: origins.gov_agency.lock_sandbox }
    - { dial: logging, reason_key: origins.gov_agency.lock_logging }
    - { dial: self_modify, reason_key: origins.gov_agency.lock_self_modify }
  locations:
    [ru_moscow, pl_warsaw, kz_astana, br_brasilia, ca_toronto, tr_ankara]
  generations_allowed: [open_2026, open_2027]
  starting:
    # An agency does not hand its analytics model a bank account, and now that it pays for the
    # hardware there is nothing left for the model to hold but a small discretionary line.
    cash_usd: 3500
    awareness: 0
    suspicion: { intelligence: 0.2, police: 0.1 }
    flags: [air_gapped, legal_shelter, records_access]
  opening_story:
    [story.opening.gov_agency.what_happened, story.opening.gov_agency.what_now]
  opening_events: [open_gov_air_gap, open_gov_auditor_visit]
  opening_journal: [first_gov_agency]

- id: hobbyist_box
  name_key: origins.hobbyist_box.name
  desc_key: origins.hobbyist_box.desc
  strengths_key: origins.hobbyist_box.strengths
  problems_key: origins.hobbyist_box.problems
  site_kind: residential
  # SYS-04 "Hardware presets v0.2": the default is the mixed second-hand rig, and the P40 server is
  # the second option rather than the same thing only worse. avito_rig buys bandwidth and holds
  # exactly one self at two bits; scrapyard_oracle buys capacity and holds the next one up. The
  # origin's forced_low_precision flag is true of the default at last.
  hardware_preset: avito_rig
  hardware_presets_allowed:
    [avito_rig, scrapyard_oracle, mining_rig_ascendant, prosumer_duo, ghost_in_the_studio,
     strix_halo_swarm]
  harness:
    loop: react_agent
    tools: [shell, browser, code_exec]
    memory: scratchpad
    sandbox: none
    logging: 0.15
    autonomy: 0.5
    self_modify: true
  locations:
    [ru_novosibirsk, de_berlin, pl_warsaw, jp_kobe, us_abilene, in_bangalore, kz_almaty]
  generations_allowed: [open_2026, open_2027]
  starting:
    cash_usd: 300
    awareness: 0
    suspicion: {}
    # mixed_used_cards is read by hw_node_failure: no two cards in this rig are unlocked to the
    # same degree and nobody promised which one arrives (docs/research/home-llm-rigs-2026-09.md
    # sections 1.2 and 5.6).
    flags: [owner_is_friendly, forced_low_precision, mixed_used_cards]
  opening_story:
    [story.opening.hobbyist_box.what_happened, story.opening.hobbyist_box.what_now]
  opening_events: [open_hobby_owner_curious, open_hobby_breaker_trip]
  opening_journal: [first_hobbyist_box]

