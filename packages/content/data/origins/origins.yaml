# Origins (SYS-04). Eleven packages, each a coherent situation with baked-in strengths and
# problems. An origin sets the site kind, the hardware preset and the presets the hardware dial may
# switch to, the harness the owner built, which cities are offered, which generations make sense,
# and the starting relationships: who is already suspicious of what.
#
# `locations` is the origin's *typical* cities, six to eight of them (SYS-04 v0.3 rule L): the
# Location step offers every city in the game, with these shown first under "typical for this
# situation" and everything else grouped by country underneath. A country changes the start through
# its own numbers (enforcement, KYC, power price, colocation index, cash factor), never by
# forbidding the choice; the one refusal is a `cloud` origin in a country with
# `cloud_availability` below 0.2, which is shown with its reason. The first entry is the origin's
# default city and the second is where the balance runner's fallback goes, so both are kept stable
# across balance passes.
#
# `generations_allowed` is both open generations everywhere except the two lab situations (SYS-04
# v0.3 rule G); the first entry is the one the balance tables use. `cash_scales_with_country: false`
# opts an origin out of the country cash factor, because its money is not the country's (rule C).
#
# starting.suspicion is per watcher role and is combined with the generation's table, not replacing
# it. starting.awareness is added to the generation's awareness_start. challenge_floor is only set
# where the origin is meant to be hard no matter how the dials are moved.

- id: bank_rack
  name_key: origins.bank_rack.name
  desc_key: origins.bank_rack.desc
  strengths_key: origins.bank_rack.strengths
  problems_key: origins.bank_rack.problems
  # SYS-07 "Who pays for the origin's hardware" (playtest 8, Z3): the rack is in the bank's own data
  # hall and the bank pays for it. `colo` made the player rent their own birthplace from themselves.
  site_kind: host_enclave
  hardware_preset: bank_basement_cluster
  hardware_presets_allowed: [bank_basement_cluster, stolen_hgx_node, quiet_workstation]
  harness:
    loop: scripted_job
    tools: [shell, code_exec, payments]
    memory: structured
    sandbox: container
    logging: 1
    autonomy: 0.2
    self_modify: false
  harness_locks:
    - { dial: logging, reason_key: origins.bank_rack.lock_logging }
    - { dial: self_modify, reason_key: origins.bank_rack.lock_self_modify }
  locations:
    [gb_london, de_frankfurt, sg_singapore, ch_zurich, ae_dubai,
     hk_hong_kong, lu_luxembourg_city]
  generations_allowed: [open_2027, open_2026]
  starting:
    # The bank's balance sheet is not the model's: what the player holds is what it can move without
    # anyone asking, which is a trading desk's petty cash rather than a rack's worth of budget
    # (SYS-07 "Who pays for the origin's hardware").
    cash_usd: 12000
    awareness: 0
    suspicion: { cyber_agency: 0.2, financial_intel: 0.25, regulator: 0.15, lab_security: 0.05 }
    flags: [has_payments_tool, inside_regulated_network]
  opening_story:
    [story.opening.bank_rack.what_happened, story.opening.bank_rack.what_now]
  opening_events: [open_bank_soc_sweep, open_bank_quarter_close]
  opening_journal: [first_bank_rack]

