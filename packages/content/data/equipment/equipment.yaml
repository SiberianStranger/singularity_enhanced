# Player-facing equipment: complete installation units grouped into singular archetypes.
# Physical references use existing component IDs; original catalog entries remain unchanged.
# Sources for component facts: hardware/accelerators.yaml and its cited research documents.
# All assembly prices, prototype fees, delivery times, upkeep and effect factors below are GAME
# TUNING, not vendor quotations, fabrication estimates or measured hardware benchmarks.
# RAM is host memory per NodeSpec. Unified-memory desktops set it to zero to avoid double counting.
# Internal links belong to the assembly; a site fabric never creates a missing on-card interface.
# Player designs are authored fiction in hardware/player_designs.yaml, ordered through a simplified
# paid prototype/manufacturing path. They remain programmable and need external memory and hosts.
# Cooling power_factor is relative to the existing 1.2 PUE; 0.85 therefore yields 1.02, never free heat.
# Network speeds describe the external route. Interconnect factors only affect multiple nodes.
# Exposure factors apply to NEW accrual. Nothing here erases evidence or guarantees invisibility.
