# Rental configurations checked against primary documentation on 2026-09-28:
# https://docs.cloud.google.com/tpu/docs/v6e : ct6e-standard-4t has 4 chips and 720 GB host RAM.
# https://aws.amazon.com/ec2/instance-types/trn2/ : trn2.3xlarge has 1 chip and 128 GB host RAM.
# The AWS offer is one complete single-chip VM. Neither offer claims universal performance superiority.
# Contract/adaptation fees and provisioning days are GAME TUNING, not provider quotes.
# Ongoing rent comes exclusively from existing accelerator cloud_usd_per_hour and site costs;
# zero equipment upkeep avoids billing the same chip rental twice.
# Existing raw Trillium peak-compute/link figures differ from current primary documentation.
# This offer preserves that inherited component record; it does not certify those old figures.
# Both services execute customer weights; this is distinct from borrowing a provider model API.
